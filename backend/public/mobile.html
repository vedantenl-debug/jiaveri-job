<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JobSetu — Mobile App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#161A2E">
  <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>
:root{--ink:#161A2E;--ink-soft:#3A3F5C;--paper:#EFEAE0;--card:#FFFFFF;--marigold:#E8A63B;--marigold-dark:#C6841E;--stamp-green:#2F6E4F;--stamp-red:#B23A2E;--line:#DCD5C4;--radius:14px;}
*{box-sizing:border-box;}
body{margin:0;font-family:'Inter',sans-serif;background:var(--paper);color:var(--ink);}
h1,h2,h3,.display{font-family:'Archivo Black',sans-serif;letter-spacing:-0.01em;}
.mono{font-family:'JetBrains Mono',monospace;}
button{font-family:inherit;cursor:pointer;}
#topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;background:var(--ink);color:#fff;}
.brand{display:flex;align-items:center;gap:10px;font-family:'Archivo Black';font-size:18px;}
.stamp-mini{width:26px;height:26px;border-radius:50%;background:var(--marigold);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;transform:rotate(-8deg);}
#mobileOuter{min-height:calc(100vh - 56px);display:flex;align-items:flex-start;justify-content:center;padding:30px 10px;background:radial-gradient(circle at 20% 10%, #E3DCC8 0%, transparent 60%), var(--paper);}
#phone{width:390px;max-width:100%;background:#0B0D17;border-radius:40px;padding:12px;box-shadow:0 30px 60px rgba(0,0,0,0.25);}
#phoneScreen{background:var(--paper);border-radius:30px;overflow:hidden;min-height:760px;display:flex;flex-direction:column;position:relative;}
#phoneContent{flex:1;overflow-y:auto;padding:18px 16px 90px;}
#phoneTabbar{background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px 6px 14px;}
.tabbtn{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:700;color:#9A957E;background:none;border:none;}
.tabbtn.active{color:var(--marigold-dark);}
.mobile-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 6px;}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;}
.btn{padding:11px 18px;border-radius:10px;border:none;font-weight:700;font-size:13.5px;}
.btn-primary{background:var(--marigold);color:var(--ink);}
.btn-outline{background:transparent;border:2px solid var(--ink);color:var(--ink);}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-danger{background:var(--stamp-red);color:#fff;}
.btn-green{background:var(--stamp-green);color:#fff;}
.btn:disabled{opacity:0.45;}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
.ticket{background:var(--card);border-radius:var(--radius);padding:16px;border:1px solid var(--line);margin-bottom:12px;position:relative;}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:#F0EAD6;color:var(--marigold-dark);margin-right:6px;}
.tag.blue{background:#E3E7F7;color:#3B4A9E;}
.job-title{font-size:15.5px;font-weight:800;margin:8px 0 2px;}
.job-meta{font-size:12.5px;color:var(--ink-soft);margin-bottom:8px;}
.job-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
.badge-status{font-size:11px;font-weight:700;padding:4px 10px;border-radius:999px;}
.badge-applied{background:#E3E7F7;color:#3B4A9E;}.badge-interview{background:#FCEBC7;color:#8A5A00;}
.badge-selected{background:#DCF3E4;color:var(--stamp-green);}.badge-rejected{background:#F7DEDB;color:var(--stamp-red);}
.badge-pending{background:#EFEAE0;color:var(--ink-soft);}.badge-approved{background:#DCF3E4;color:var(--stamp-green);}.badge-blocked{background:#F7DEDB;color:var(--stamp-red);}
.lock-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-soft);background:#F5F1E7;border:1px dashed var(--line);border-radius:8px;padding:8px 10px;margin-top:8px;}
.unlock-row{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--stamp-green);background:#EAF6EE;border:1px solid #CFE9D8;border-radius:8px;padding:8px 10px;margin-top:8px;font-weight:600;}
.field{margin-bottom:12px;}
.field label{display:block;font-size:12.5px;font-weight:700;margin-bottom:5px;color:var(--ink-soft);}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px;background:#fff;}
.field textarea{resize:vertical;min-height:70px;}
.pill-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;overflow-x:auto;}
.pill{padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:12px;font-weight:600;white-space:nowrap;}
.pill.active{background:var(--ink);color:#fff;border-color:var(--ink);}
.empty{text-align:center;padding:40px 10px;color:var(--ink-soft);font-size:13.5px;}
.subtle{color:var(--ink-soft);font-size:12.5px;}
.divider{height:1px;background:var(--line);margin:14px 0;}
.notif-item{padding:10px 0;border-bottom:1px solid var(--line);font-size:13px;}
.notif-item b{display:block;font-size:13px;margin-bottom:2px;}
.notif-dot{width:7px;height:7px;border-radius:50%;background:var(--marigold-dark);display:inline-block;margin-right:6px;}
.bellwrap{position:relative;}
.bellcount{position:absolute;top:-6px;right:-6px;background:var(--stamp-red);color:#fff;font-size:10px;border-radius:50%;width:16px;height:16px;display:flex;align-items:center;justify-content:center;}
.role-pick{display:flex;gap:8px;margin-bottom:14px;}
.role-pick button{flex:1;padding:10px;border-radius:8px;border:1.5px solid var(--line);background:#fff;font-weight:700;font-size:12px;}
.role-pick button.active{border-color:var(--marigold-dark);background:#FCF3DF;color:var(--marigold-dark);}
.err-box{background:#F7DEDB;color:var(--stamp-red);padding:9px 12px;border-radius:8px;font-size:12.5px;margin-bottom:10px;}
.stamp{display:inline-flex;align-items:center;gap:5px;font-family:'Archivo Black';font-size:10px;color:var(--stamp-green);border:2px solid var(--stamp-green);border-radius:6px;padding:3px 7px;transform:rotate(-3deg);}
.stamp.red{color:var(--stamp-red);border-color:var(--stamp-red);}
.loading{text-align:center;padding:60px 10px;color:var(--ink-soft);}
.overlay{position:fixed;inset:0;background:rgba(22,26,46,.55);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px;}
.overlay .modal{background:#fff;border-radius:16px;padding:24px 20px;max-width:320px;width:100%;position:relative;box-shadow:0 20px 50px rgba(0,0,0,.25);}
.overlay .modal-close{position:absolute;top:8px;right:12px;background:none;border:none;font-size:22px;line-height:1;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="topbar">
  <div class="brand"><span class="stamp-mini">JS</span> JobSetu </div>
  <div id="sessionChip"></div>
</div>
<div id="mobileOuter">
  <div id="phone"><div id="phoneScreen"></div></div>
</div>

<script>
const CATEGORIES = ["Computer / IT","Mechanical","Electrical","Civil","Electronics","Production","Automobile","Sales","HR","Accounts","Office Staff","Driver","Helper","Security","Hotel","Healthcare","इतर"];

/* ---------- API helper ---------- */
async function api(path, opts={}){
  opts.headers = opts.headers || {};
  if(!(opts.body instanceof FormData)){
    opts.headers['Content-Type'] = 'application/json';
  }
  const token = localStorage.getItem('JS_token');
  if(token) opts.headers['Authorization'] = 'Bearer ' + token;
  const res = await fetch('/api' + path, opts);
  let data = {};
  try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error(data.error || 'काहीतरी चुकले.');
  return data;
}
function getUser(){
  const raw = localStorage.getItem('JS_user');
  return raw ? JSON.parse(raw) : null;
}
function setUser(u){ localStorage.setItem('JS_user', JSON.stringify(u)); }
function logout(){ localStorage.removeItem('JS_token'); localStorage.removeItem('JS_user'); appState.page='dashboard'; render(); }

let appState = { page:'dashboard', jobFilter:'All', authMode:'login', authRole:'candidate', authError:'', upiModalOpen:false, upiModalAmount:99, upiModalRole:'candidate', upiModalJobId:null };

function statusLabel(s){ return {applied:'अर्ज केला', interview:'इंटरव्ह्यू', selected:'निवड झाली', rejected:'नाकारले', pending:'प्रलंबित', approved:'मंजूर', blocked:'ब्लॉक'}[s]||s; }

/* ============ ROOT RENDER ============ */
async function render(){
  const chip = document.getElementById('sessionChip');
  const user = getUser();
  if(user){
    chip.innerHTML = `<span style="font-size:13px;color:#DADDF0;">${user.role==='admin'?'👤 Admin':user.role==='company'?'🏢 '+user.name:'👤 '+user.name}</span> <button id="topLogoutBtn" style="background:none;border:1px solid #454A6B;color:#DADDF0;border-radius:8px;padding:5px 10px;font-size:12px;margin-left:8px;">Logout</button>`;
    document.getElementById('topLogoutBtn').onclick = logout;
  } else {
    chip.innerHTML = '';
  }
  const screen = document.getElementById('phoneScreen');
  screen.innerHTML = `<div class="loading">लोड होत आहे...</div>`;
  try{
    screen.innerHTML = user ? await renderApp(user) : renderAuth();
  }catch(e){
    screen.innerHTML = `<div class="loading">एरर: ${e.message}<br><button class="btn btn-ghost" onclick="render()" style="margin-top:10px;">पुन्हा प्रयत्न करा</button></div>`;
  }
  attachHandlers(user);
}

/* ============ AUTH (login/register) ============ */
function renderAuth(){
  const f = appState;
  const showRegister = f.authRole !== 'admin';
  return `
  <div style="display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:50px 20px 20px;">
    <div class="stamp-mini" style="width:52px;height:52px;font-size:20px;border-radius:16px;">JS</div>
    <h1 class="display" style="font-size:22px;margin:6px 0;">JobSetu</h1>
    <p class="subtle">स्थानिक नोकऱ्या, तुमच्या खिशात.</p>
  </div>
  <div style="padding:0 18px;">
    <div class="role-pick">
      <button data-role="candidate" class="${f.authRole==='candidate'?'active':''}">Job Seeker</button>
      <button data-role="company" class="${f.authRole==='company'?'active':''}">Company</button>
      <button data-role="admin" class="${f.authRole==='admin'?'active':''}">Admin</button>
    </div>
    ${f.authError ? `<div class="err-box">${f.authError}</div>` : ''}
    ${f.authMode==='register' ? `<div class="field"><label>${f.authRole==='company'?'कंपनीचे नाव':'नाव'}</label><input id="nameInput" placeholder="नाव टाका"></div>` : ''}
    <div class="field"><label>मोबाईल नंबर</label><input id="phoneInput" placeholder="10 अंकी मोबाईल नंबर"></div>
    <div class="field"><label>पासवर्ड</label><input id="passwordInput" type="password" placeholder="पासवर्ड टाका"></div>
    <button class="btn btn-primary" id="authSubmitBtn" style="width:100%;">${f.authMode==='register'?'नोंदणी करा':'Login करा'}</button>
    ${showRegister ? `<p class="subtle" style="text-align:center;margin-top:12px;">${f.authMode==='register'?'आधीच खाते आहे?':'खाते नाही?'} <a id="toggleAuth" style="color:var(--marigold-dark);font-weight:700;cursor:pointer;">${f.authMode==='register'?'Login करा':'नोंदणी करा'}</a></p>` : ''}
  </div>
  <div style="padding:22px 18px 30px;border-top:1px solid var(--line);margin-top:22px;">
    <span style="display:inline-block;background:var(--marigold);color:var(--ink);font-weight:800;font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;padding:4px 10px;border-radius:20px;margin-bottom:10px;">आमचं व्हिजन</span>
    <h2 style="font-family:'Archivo Black',sans-serif;font-size:18px;margin:0 0 8px;line-height:1.3;">स्थानिक प्रतिभा, स्थानिक संधी — एका क्लिकवर.</h2>
    <p class="subtle" style="font-size:13.5px;line-height:1.55;margin:0 0 16px;">JobSetu हे लातूर जिल्ह्यातील तरुणांना विश्वासार्ह स्थानिक कंपन्यांशी थेट जोडण्यासाठी बनवलेलं व्यासपीठ आहे. आमचा उद्देश साधा आहे — प्रत्येक पात्र उमेदवाराला त्याच्या घराजवळ योग्य संधी मिळावी, आणि प्रत्येक कंपनीला भरवशाचे स्थानिक कर्मचारी मिळावेत.</p>
    <div style="display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;">
      <img src="/founder.jpg" alt="Founder" style="width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--marigold);flex-shrink:0;" onerror="this.style.display='none'">
      <div style="text-align:left;"><div style="font-weight:800;font-size:13px;">VEDANT R. POTDAR .</div><div class="subtle" style="font-size:11.5px;">Founder, JobSetu</div></div>
    </div>
  </div>`;
}

/* ============ LOGGED-IN APP ============ */
async function renderApp(user){
  const page = appState.page;
  let content = '';
  if(user.role==='candidate'){
    if(page==='dashboard') content = await candidateDashboard();
    else if(page==='search') content = await candidateSearch();
    else if(page==='applications') content = await candidateApplications();
    else if(page==='notifications') content = await notificationsView();
    else if(page==='profile') content = await candidateProfile();
  } else if(user.role==='company'){
    if(page==='dashboard') content = await companyDashboard();
    else if(page==='search') content = await companyVacancies();
    else if(page==='applications') content = await companyApplicationsAll();
    else if(page==='notifications') content = await notificationsView();
    else if(page==='profile') content = await companyProfile();
  } else if(user.role==='admin'){
    if(page==='dashboard') content = await adminDashboard();
    else if(page==='search') content = await adminJobs();
    else if(page==='applications') content = await adminCompanies();
    else if(page==='notifications') content = await notificationsView();
    else if(page==='profile') content = await adminPayments();
  }
  const unread = await unreadCount();
  return `
  <div class="mobile-topbar">
    <div><div style="font-size:11px;color:var(--ink-soft);">नमस्कार 👋</div><div style="font-weight:800;font-size:15px;">${user.name}</div></div>
    <div style="display:flex;align-items:center;gap:10px;">
      <div class="bellwrap" data-page="notifications">🔔${unread>0?`<span class="bellcount">${unread}</span>`:''}</div>
      <div class="avatar">${user.name.slice(0,1)}</div>
    </div>
  </div>
  <div id="phoneContent">${content}</div>
  <div id="phoneTabbar">
    <button class="tabbtn ${page==='dashboard'?'active':''}" data-page="dashboard">🏠<br>Home</button>
    <button class="tabbtn ${page==='search'?'active':''}" data-page="search">🔎<br>Search</button>
    <button class="tabbtn ${page==='applications'?'active':''}" data-page="applications">📄<br>Apply</button>
    <button class="tabbtn ${page==='notifications'?'active':''}" data-page="notifications">🔔<br>Notify</button>
    <button class="tabbtn ${page==='profile'?'active':''}" data-page="profile">👤<br>Profile</button>
  </div>${upiModal()}`;
}
function upiModal(){
  if(!appState.upiModalOpen) return '';
  const upiId = 'Jobsetu2026@ybl';
  const amount = appState.upiModalAmount || 99;
  const upiLink = `upi://pay?pa=${upiId}&pn=JobSetu&am=${amount}&cu=INR`;
  const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiLink)}`;
  return `
  <div class="overlay" id="upiOverlay">
    <div class="modal" style="text-align:center;">
      <button class="modal-close" id="upiCloseBtn">×</button>
      <h3 style="margin-top:0;">₹${amount} सदस्यत्व शुल्क</h3>
      <p class="subtle">खालील UPI ID वर पैसे पाठवा, किंवा QR कोड स्कॅन करा.</p>
      <img src="${qrUrl}" alt="UPI QR" style="width:200px;height:200px;margin:10px 0;border:1px solid var(--line);border-radius:10px;">
      <div class="card mono" style="margin:10px 0;font-weight:800;font-size:15px;">${upiId}</div>
      <p class="subtle" style="font-size:11.5px;">पैसे पाठवल्यावर <b>पेमेंटचा स्क्रीनशॉट WhatsApp वर 9404180011 या नंबरवर पाठवा</b>. Admin पडताळून सदस्यत्व सक्रिय करेल.</p>
      <button class="btn btn-primary" id="upiPaidBtn" style="width:100%;margin-top:8px;">मी ₹${amount} पाठवले</button>
    </div>
  </div>`;
}
async function unreadCount(){
  try{ const rows = await api('/notifications'); return rows.filter(n=>n.unread).length; }catch(e){ return 0; }
}

/* ---- CANDIDATE ---- */
async function candidateDashboard(){
  const [profile, apps] = await Promise.all([api('/profile/candidate/me'), api('/applications/mine')]);
  return `
  <div class="card"><div class="job-meta">Category: ${profile.category||'—'} · अनुभव: ${profile.experience||'—'}</div>
  <div class="subtle" style="margin-top:6px;">सदस्यत्व: ${profile.membership_active?'✅ सक्रिय (संपेल: '+profile.membership_expiry+')':'❌ निष्क्रिय'}</div></div>
  <h3 style="font-size:15px;">माझे अलीकडील अर्ज</h3>
  ${apps.slice(0,3).map(a=>`<div class="ticket"><div class="job-title">${a.job_title}</div><div class="job-meta">${a.company_name}</div><span class="badge-status badge-${a.status}">${statusLabel(a.status)}</span></div>`).join('')||'<div class="empty">अजून अर्ज नाही.</div>'}
  `;
}
async function candidateSearch(){
  const jobs = await api('/jobs' + (appState.jobFilter!=='All' ? '?category='+encodeURIComponent(appState.jobFilter) : ''));
  const myApps = await api('/applications/mine');
  const appliedJobIds = new Set(myApps.map(a=>a.job_id));
  return `
  <div class="pill-row"><span class="pill ${appState.jobFilter==='All'?'active':''}" data-filter="All">सर्व</span>${CATEGORIES.map(c=>`<span class="pill ${appState.jobFilter===c?'active':''}" data-filter="${c}">${c}</span>`).join('')}</div>
  ${jobs.map(j=>`<div class="ticket"><span class="tag">${j.category}</span><span class="tag blue">${j.location}</span>
    <div class="job-title">${j.title}</div><div class="job-meta">${j.company_name} · ${j.salary}</div>
    <div style="font-size:12.5px;color:var(--ink-soft);">${j.description}</div>
    <div class="job-actions">${appliedJobIds.has(j.id) ? `<span class="badge-status badge-applied">अर्ज केला</span>` : `<button class="btn btn-primary" data-apply="${j.id}">Apply करा</button>`}</div>
  </div>`).join('') || '<div class="empty">या Category मध्ये सध्या व्हॅकन्सी नाही.</div>'}`;
}
async function candidateApplications(){
  const apps = await api('/applications/mine');
  if(!apps.length) return `<div class="empty">तुम्ही अजून कोणत्याही जॉबसाठी अर्ज केलेला नाही.</div>`;
  return apps.map(a=>`<div class="card"><div class="job-title">${a.job_title}</div><div class="job-meta">${a.company_name} · ${a.applied_at.slice(0,10)}</div>
    <span class="badge-status badge-${a.status}">${statusLabel(a.status)}</span>${a.interview_date?`<div class="subtle" style="margin-top:6px;">इंटरव्ह्यू: ${a.interview_date}</div>`:''}</div>`).join('');
}
async function candidateProfile(){
  const p = await api('/profile/candidate/me');
  return `
  <div class="field"><label>नाव</label><input id="pName" value="${p.name}"></div>
  <div class="field"><label>Category</label><select id="pCategory">${CATEGORIES.map(c=>`<option ${c===p.category?'selected':''}>${c}</option>`).join('')}</select></div>
  <div class="field"><label>अनुभव</label><input id="pExp" value="${p.experience||''}" placeholder="उदा. 2 वर्षे"></div>
  <div class="field"><label>मोबाईल नंबर</label><input value="${p.phone}" disabled></div>
  <button class="btn btn-primary" id="saveProfileBtn">जतन करा</button>
  <div class="divider"></div>
  <div class="field"><label>Resume</label>
    <div class="subtle mono" style="margin-bottom:6px;">${p.resume_path || 'अजून अपलोड केलेला नाही'}</div>
    <input type="file" id="resumeFile" accept=".pdf,.doc,.docx">

async function notificationsView(){

/* ============ HANDLERS ============ */
function attachHandlers(user){
  document.querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{ appState.authRole=b.dataset.role; if(b.dataset.role==='admin') appState.authMode='login'; appState.authError=''; render(); });
  const toggleAuth = document.getElementById('toggleAuth');
  if(toggleAuth) toggleAuth.onclick = ()=>{ appState.authMode = appState.authMode==='register'?'login':'register'; appState.authError=''; render(); };
  const authSubmitBtn = document.getElementById('authSubmitBtn');
  if(authSubmitBtn) authSubmitBtn.onclick = async ()=>{
    const phone = document.getElementById('phoneInput').value.trim();
    const password = document.getElementById('passwordInput').value.trim();
    const role = appState.authRole;
    try{
      let data;
      if(appState.authMode==='register'){
        const name = document.getElementById('nameInput').value.trim();
        if(!name) throw new Error('कृपया नाव टाका.');
        data = await api(`/auth/${role}/register`, {method:'POST', body: JSON.stringify({name, phone, password})});
      } else {
        data = await api(`/auth/${role}/login`, {method:'POST', body: JSON.stringify({phone, password})});
      }
      localStorage.setItem('JS_token', data.token);
      setUser({role: data.role, id: data.id, name: data.name});
      appState.page = 'dashboard'; appState.authError='';
      render();
    }catch(e){ appState.authError = e.message; render(); }
  };

  document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{ appState.page=b.dataset.page; render(); });
  document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{ appState.jobFilter=b.dataset.filter; render(); });

  document.querySelectorAll('[data-apply]').forEach(b=>b.onclick=async()=>{
    const jobId = Number(b.dataset.apply);
    try{
      await api('/applications', {method:'POST', body: JSON.stringify({job_id: jobId})});
      alert('अर्ज यशस्वीरित्या पाठवला!');
      render();
    }catch(e){
      if(e.message.includes('सदस्यत्व')){
        appState.upiModalOpen = true;
        appState.upiModalAmount = 99;
        appState.upiModalRole = 'candidate';
        appState.upiModalJobId = jobId;
        render();
      } else {
        alert(e.message);
      }
    }
  });
  document.querySelectorAll('[data-deletejob]').forEach(b=>b.onclick=async()=>{
    if(!confirm('ही व्हॅकन्सी डिलीट करायची आहे का?')) return;
    try{ await api('/jobs/'+b.dataset.deletejob, {method:'DELETE'}); render(); }catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-deletecand]').forEach(b=>b.onclick=async()=>{
    if(!confirm('हा उमेदवार कायमचा डिलीट करायचा आहे का? त्याचे सर्व अर्जही मिटतील.')) return;
    try{ await api('/admin/candidates/'+b.dataset.deletecand, {method:'DELETE'}); render(); }catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-deleteco]').forEach(b=>b.onclick=async()=>{
    if(!confirm('ही कंपनी कायमची डिलीट करायची आहे का? त्यांच्या सर्व व्हॅकन्सी व अर्जही मिटतील.')) return;
    try{ await api('/admin/companies/'+b.dataset.deleteco, {method:'DELETE'}); render(); }catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-activatecand]').forEach(b=>b.onclick=async()=>{
    if(!confirm('या उमेदवाराचं ₹99 सदस्यत्व सक्रिय करायचं आहे का?')) return;
    try{ await api('/admin/candidates/'+b.dataset.activatecand+'/activate-membership', {method:'PUT'}); alert('सदस्यत्व सक्रिय झालं.'); render(); }catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-activateco]').forEach(b=>b.onclick=async()=>{
    if(!confirm('या कंपनीचं ₹200 सदस्यत्व सक्रिय करायचं आहे का?')) return;
    try{ await api('/admin/companies/'+b.dataset.activateco+'/activate-membership', {method:'PUT'}); alert('सदस्यत्व सक्रिय झालं.'); render(); }catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-appstatus]').forEach(b=>b.onclick=async()=>{
    const [id,status]=b.dataset.appstatus.split(':');
    try{ await api('/applications/'+id, {method:'PUT', body: JSON.stringify({status})}); render(); }catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-schedint]').forEach(b=>b.onclick=async()=>{
    const date = prompt('इंटरव्ह्यूची तारीख व वेळ टाका:', '2026-07-20 10:00 AM');
    if(!date) return;
    try{ await api('/applications/'+b.dataset.schedint, {method:'PUT', body: JSON.stringify({status:'interview', interview_date:date})}); render(); }catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-costatus]').forEach(b=>b.onclick=async()=>{
    const [id,status]=b.dataset.costatus.split(':');
    try{ await api('/admin/companies/'+id+'/status', {method:'PUT', body: JSON.stringify({status})}); render(); }catch(e){ alert(e.message); }
  });
  document.querySelectorAll('[data-jobapprove]').forEach(b=>b.onclick=async()=>{
    const [id,status]=b.dataset.jobapprove.split(':');
    try{ await api('/admin/jobs/'+id+'/status', {method:'PUT', body: JSON.stringify({status})}); render(); }catch(e){ alert(e.message); }
  });
  const postJobBtn = document.getElementById('postJobBtn');
  if(postJobBtn) postJobBtn.onclick = async ()=>{
    const title = document.getElementById('newJobTitle').value.trim();
    if(!title){ alert('कृपया पदाचे नाव टाका.'); return; }
    try{
      await api('/jobs', {method:'POST', body: JSON.stringify({
        title, category: document.getElementById('newJobCat').value, location: document.getElementById('newJobLoc').value,
        salary: document.getElementById('newJobSalary').value, description: document.getElementById('newJobDesc').value
      })});
      render();
    }catch(e){ alert(e.message); }
  };
  const saveProfileBtn = document.getElementById('saveProfileBtn');
  if(saveProfileBtn) saveProfileBtn.onclick = async ()=>{
    const role = user.role;
    const body = role==='company'
      ? {name:document.getElementById('pName').value, category:document.getElementById('pCategory').value, location:document.getElementById('pLocation').value}
      : {name:document.getElementById('pName').value, category:document.getElementById('pCategory').value, experience:document.getElementById('pExp').value};
    try{ await api(`/profile/${role==='company'?'company':'candidate'}/me`, {method:'PUT', body: JSON.stringify(body)}); alert('जतन झाले.'); render(); }catch(e){ alert(e.message); }
  };
  const uploadResumeBtn = document.getElementById('uploadResumeBtn');
  if(uploadResumeBtn) uploadResumeBtn.onclick = async ()=>{
    const file = document.getElementById('resumeFile').files[0];
    if(!file){ alert('कृपया फाईल निवडा.'); return; }
    const fd = new FormData(); fd.append('resume', file);
    try{ await api('/profile/candidate/me/resume', {method:'POST', body: fd}); alert('Resume अपलोड झाला.'); render(); }catch(e){ alert(e.message); }
  };
  const payBtn = document.getElementById('payBtn');
  if(payBtn) payBtn.onclick = ()=>{
    const isCompany = user.role === 'company';
    appState.upiModalOpen = true;
    appState.upiModalAmount = isCompany ? 200 : 99;
    appState.upiModalRole = isCompany ? 'company' : 'candidate';
    render();
  };
  const upiPaidBtn = document.getElementById('upiPaidBtn');
  if(upiPaidBtn) upiPaidBtn.onclick = async()=>{
    try{
      const endpoint = appState.upiModalRole === 'company' ? '/payments/notify-manual' : '/applications/notify-payment';
      await api(endpoint, {method:'POST'});
      alert('धन्यवाद! तुमचं पेमेंट Admin कडे पडताळणीसाठी पाठवलं आहे. साधारण काही तासांत सदस्यत्व सक्रिय होईल.');
      appState.upiModalOpen = false;
      render();
    }catch(e){ alert(e.message); }
  };
  const upiCloseBtn = document.getElementById('upiCloseBtn');
  if(upiCloseBtn) upiCloseBtn.onclick = ()=>{ appState.upiModalOpen = false; render(); };
}

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(()=>{});
}
render();
</script>
